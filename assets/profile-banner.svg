<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Supun Liyanage</title>
  <desc id="desc">Associate Software Engineer and iOS Developer. A navy banner with teal geometric accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#102F36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.12"/>
    </pattern>
    <clipPath id="bounds"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="1090" cy="148" r="222" fill="none" stroke="#5EEAD4" stroke-opacity="0.09"/>
    <circle cx="1090" cy="148" r="162" fill="none" stroke="#5EEAD4" stroke-opacity="0.13"/>
    <circle cx="1090" cy="148" r="102" fill="none" stroke="#5EEAD4" stroke-opacity="0.19"/>
    <path d="M917 92 L859 150 L917 208 M1035 92 L1093 150 L1035 208 M994 77 L958 223" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <rect x="64" y="60" width="52" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="145" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">Supun Liyanage</text>
    <text x="67" y="191" fill="#CBD5E1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25">Associate Software Engineer · iOS Developer</text>
    <text x="67" y="242" fill="#5EEAD4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3">WEB / MOBILE / AI</text>
